<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Happy Halloween!</title>
<style>
  :root { --orange: #ff7a00; --glow: #ffb347; --blood: #ff2a1f; --bone: #f4e9d8; }
  * { box-sizing: border-box; margin: 0; }
  html { background: #000; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 16px 24px 32px;
    background: #000;
    color: var(--bone);
    font-family: "Times New Roman", Times, serif;
    text-align: center;
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 440px; }

  .pumpkin {
    display: block;
    width: min(70vw, 38dvh, 360px);
    height: auto;
    margin: 0 auto;
    opacity: 0;
    animation: rise 1.6s ease-out forwards, flicker 3.4s 1.6s infinite;
  }
  .lead { font-size: 25px; font-weight: 700; line-height: 1.25; margin-top: 12px; }
  .en { font-size: 17px; font-style: italic; line-height: 1.35; margin-top: 6px; opacity: 0.75; }
  .warning { margin-top: 26px; color: var(--blood); }
  .warning .lead {
    margin-top: 0;
    font-size: 36px;
    line-height: 1.12;
    text-shadow: 0 0 18px rgba(255, 42, 31, 0.55);
  }
  .warning .en { font-size: 20px; font-weight: 700; font-style: normal; opacity: 1; }
  .free { margin-top: 28px; font-size: 16px; line-height: 1.45; color: var(--glow); }

  .reveal { opacity: 0; animation: appear 0.7s ease-out forwards; }
  .reveal.one { animation-delay: 0.9s; }
  .reveal.two { animation-delay: 2.2s; }
  .reveal.three { animation-delay: 3.4s; }

  @keyframes rise {
    from { opacity: 0; transform: scale(0.92); filter: brightness(0.3); }
    to { opacity: 1; transform: scale(1); filter: brightness(1); }
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; filter: brightness(1); }
    8% { opacity: 1; filter: brightness(1.18); }
    12% { opacity: 1; filter: brightness(0.82); }
    20% { opacity: 1; filter: brightness(1.08); }
    46% { opacity: 1; filter: brightness(0.95); }
    50% { opacity: 1; filter: brightness(1.22); }
    53% { opacity: 1; filter: brightness(0.74); }
    58% { opacity: 1; filter: brightness(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pumpkin, .reveal { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <main>
    <img class="pumpkin" src="pumpkin.jpg" alt="A glowing jack-o'-lantern grinning in the dark" width="720" height="720">
    <div class="reveal one">
      <p class="lead">Bạn vừa quét mã QR của một người lạ mặc đồng phục giả.</p>
      <p class="en">You just scanned a QR code from a stranger in a fake uniform.</p>
    </div>
    <div class="warning reveal two">
      <p class="lead">Đừng bao giờ làm vậy nữa.</p>
      <p class="en">Never do that again.</p>
    </div>
    <p class="free reveal three">(Gửi xe miễn phí. Chúc mừng Halloween!)<br>(Parking is free. Happy Halloween!)</p>
  </main>
</body>
</html>
